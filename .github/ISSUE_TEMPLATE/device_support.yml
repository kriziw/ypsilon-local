name: Device compatibility report
description: Report a compatible or potentially compatible Runxin water softener/controller or transport.
title: "[Device]: "
labels: [compatibility]
body:
  - type: input
    id: brand_model
    attributes:
      label: Brand and model
    validations:
      required: true
  - type: input
    id: valve
    attributes:
      label: Valve/controller model
      placeholder: Runxin F79D
  - type: input
    id: transport
    attributes:
      label: Transport / communication module
      description: BroadLink, UART/serial, TCP bridge, ESP-based module, or other transport if known.
      placeholder: BroadLink BL3372
  - type: input
    id: transport_id
    attributes:
      label: Transport identifier / device type
      description: For BroadLink, include the devtype if known; for other transports include an equivalent model/protocol identifier.
      placeholder: BroadLink devtype 0x520F
  - type: textarea
    id: behavior
    attributes:
      label: What works and what does not?
    validations:
      required: true
  - type: textarea
    id: diagnostic_report
    attributes:
      label: Read-only compatibility report
      description: Runxin Local 2.8.0+ can prepare this inside Home Assistant even for unlisted models or authentication failures. Add the integration, choose the read-only report, save the diagnostic entry, and attach its downloaded diagnostics JSON here. Partial reports are useful. No Python setup, model edits, new writes or regeneration are needed.
      placeholder: Attach the diagnostics JSON, or describe the step/error if collection was not possible.
  - type: textarea
    id: comparison
    attributes:
      label: App or controller comparison (optional)
      description: A few readings/photos with units help confirm resin volume, hardness, flow cutoff, capacity and programme times. Remove identifiers. Do not change settings just to take screenshots.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Do not upload vendor APKs, firmware, private keys, pairing keys, credentials, account tokens, or unredacted packet captures.
