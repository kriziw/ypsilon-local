name: Offline audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: Offline audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check pytest python-broadlink==1.0.6
      - name: Publication metadata check
        run: python scripts/publication_check.py
      - name: Integration audit and protocol regressions
        run: python scripts/audit.py
      - name: F79D field surface audit
        run: python scripts/field_surface_audit.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q custom_components/ypsilon_local scripts tests
