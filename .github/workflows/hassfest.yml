name: Validate with hassfest

on:
  push:
  pull_request:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master
