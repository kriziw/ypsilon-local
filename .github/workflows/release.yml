name: Publish GitHub release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Run this workflow from the main branch, not $GITHUB_REF"
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install release-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-offline.txt
      - name: Resolve manifest version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ypsilon_local/manifest.json"))["version"])')"
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Validate main source before tagging
        run: |
          python scripts/publication_check.py
          python scripts/audit.py
          python scripts/field_surface_audit.py
          python -m pytest -q
          python -m compileall -q custom_components/ypsilon_local scripts tests
      - name: Prepare release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump manifest.json, CHANGELOG.md and info.md before publishing new code."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it only for release recovery"
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Runxin Local $VERSION" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Check out tagged release source
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: git checkout --detach "$TAG"
      - name: Validate tagged release source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAGGED_VERSION="$(python -c 'import json; print(json.load(open("custom_components/ypsilon_local/manifest.json"))["version"])')"
          test "$TAGGED_VERSION" = "$VERSION" || {
            echo "Existing tag contains manifest version $TAGGED_VERSION, expected $VERSION"
            exit 1
          }
          python scripts/publication_check.py
          python scripts/audit.py
          python scripts/field_surface_audit.py
          python -m pytest -q
          python -m compileall -q custom_components/ypsilon_local scripts tests
      - name: Build manual-install archive
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: zip -r "ypsilon_local-${TAG}.zip" custom_components/ypsilon_local -x "*/__pycache__/*" "*.pyc"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "ypsilon_local-${TAG}.zip" --verify-tag --generate-notes --title "Runxin Local ${TAG}" "${FLAGS[@]}"

  tag-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install release-test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test-offline.txt
      - name: Validate release source
        run: |
          python scripts/publication_check.py
          python scripts/audit.py
          python scripts/field_surface_audit.py
          python -m pytest -q
          python -m compileall -q custom_components/ypsilon_local scripts tests
      - name: Verify tag matches manifest version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/ypsilon_local/manifest.json"))["version"])')"
          test "$TAG" = "$VERSION" || { echo "Tag v$TAG does not match manifest $VERSION"; exit 1; }
      - name: Refuse duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 1
          fi
      - name: Build manual-install archive
        run: zip -r "ypsilon_local-${GITHUB_REF_NAME}.zip" custom_components/ypsilon_local -x "*/__pycache__/*" "*.pyc"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FLAGS=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "ypsilon_local-${GITHUB_REF_NAME}.zip" --verify-tag --generate-notes --title "Runxin Local ${GITHUB_REF_NAME}" "${FLAGS[@]}"
